name: Update Profile

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Manual trigger
  repository_dispatch:
    types: [update-profile]  # Triggered by other repos

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get contribution stats
        id: stats
        uses: actions/github-script@v7
        with:
          script: |
            const query = `{
              user(login: "apoorvgarg31") {
                contributionsCollection {
                  totalCommitContributions
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                      }
                    }
                  }
                }
              }
            }`;
            
            const result = await github.graphql(query);
            const total = result.user.contributionsCollection.contributionCalendar.totalContributions;
            const commits = result.user.contributionsCollection.totalCommitContributions;
            
            // Get today's contributions
            const weeks = result.user.contributionsCollection.contributionCalendar.weeks;
            const today = new Date().toISOString().split('T')[0];
            let todayContribs = 0;
            for (const week of weeks) {
              for (const day of week.contributionDays) {
                if (day.date === today) {
                  todayContribs = day.contributionCount;
                }
              }
            }
            
            // Calculate pet evolution stage
            let petEmoji = '🥚';
            let petStage = 'Egg';
            if (total >= 500) { petEmoji = '👑'; petStage = 'Elder'; }
            else if (total >= 200) { petEmoji = '🐤'; petStage = 'Adult'; }
            else if (total >= 50) { petEmoji = '🐥'; petStage = 'Teen'; }
            else if (total >= 10) { petEmoji = '🐣'; petStage = 'Baby'; }
            
            // Calculate mood based on today's activity
            let mood = 'SLEEPY 😴';
            let moodEmoji = '😴';
            if (todayContribs >= 50) { mood = 'ECSTATIC 🤩'; moodEmoji = '🤩'; }
            else if (todayContribs >= 20) { mood = 'HAPPY 😊'; moodEmoji = '😊'; }
            else if (todayContribs >= 10) { mood = 'CONTENT 🙂'; moodEmoji = '🙂'; }
            else if (todayContribs >= 5) { mood = 'OKAY 😐'; moodEmoji = '😐'; }
            else if (todayContribs >= 1) { mood = 'HUNGRY 😕'; moodEmoji = '😕'; }
            
            // Calculate stats (based on recent activity)
            const hunger = Math.min(100, Math.max(0, todayContribs * 5));
            const happiness = Math.min(100, Math.max(0, todayContribs * 4 + 20));
            const energy = Math.min(100, Math.max(0, 50 + todayContribs * 2));
            
            core.setOutput('total', total);
            core.setOutput('commits', commits);
            core.setOutput('today', todayContribs);
            core.setOutput('pet_emoji', petEmoji);
            core.setOutput('pet_stage', petStage);
            core.setOutput('mood', mood);
            core.setOutput('mood_emoji', moodEmoji);
            core.setOutput('hunger', hunger);
            core.setOutput('happiness', happiness);
            core.setOutput('energy', energy);
            
      - name: Update README
        run: |
          # Update pet status section
          cat > /tmp/pet_section.md << 'EOF'
          ### 🐣 My Pet Status

          **${{ steps.stats.outputs.pet_emoji }} Pip the Blob** | ${{ steps.stats.outputs.mood }}

          | Hunger | Happiness | Energy | Today's Commits |
          |:------:|:---------:|:------:|:---------------:|
          | ${{ steps.stats.outputs.hunger }}% | ${{ steps.stats.outputs.happiness }}% | ${{ steps.stats.outputs.energy }}% | ${{ steps.stats.outputs.today }} |

          > *Stage: **${{ steps.stats.outputs.pet_stage }}** (${{ steps.stats.outputs.total }} total contributions) • This pet feeds on my git commits!*

          [![terminal-pet](https://img.shields.io/badge/🐣_terminal--pet-Get_Yours-brightgreen?style=for-the-badge)](https://github.com/apoorvgarg31/terminal-pet)

          ```bash
          pip install git+https://github.com/apoorvgarg31/terminal-pet.git
          ```
          EOF
          
          # Use sed to replace the pet section
          sed -i '/### 🐣 My Pet Status/,/```bash/{/```bash/!d}' README.md
          sed -i '/### 🐣 My Pet Status/d' README.md
          sed -i '/pip install git+https:\/\/github.com\/apoorvgarg31\/terminal-pet.git/d' README.md
          sed -i '/```$/d' README.md
          
          # Find where to insert (before GitHub Stats)
          sed -i '/### 📊 GitHub Stats/e cat /tmp/pet_section.md' README.md
          
      - name: Commit and push
        run: |
          git config user.name "Apy"
          git config user.email "apoorvgarg31@gmail.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🐣 Update pet status (${GITHUB_RUN_NUMBER})"
            git push
          fi
